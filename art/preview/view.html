<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = await (await fetch('scene.json')).json();
window.SCENE = scene;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(1280, 720); document.body.appendChild(renderer.domElement);
const world = new THREE.Scene();
const groups = {};
for (const b of scene.batches) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(b.v, 3));
  // Unity is left-handed: z is mirrored, which flips the winding, so each triangle's order is swapped back
  const pos = g.attributes.position; for (let i = 0; i < pos.count; i++) pos.setZ(i, -pos.getZ(i));
  const idx = b.t.slice(); for (let i = 0; i < idx.length; i += 3) { const k = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = k; } g.setIndex(idx); g.computeVertexNormals();
  g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
  let map = null;
  const t = scene.textures[b.tex];
  if (t) {
    if (!t.three) {
      const raw = Uint8Array.from(atob(t.px), ch => ch.charCodeAt(0));
      t.three = new THREE.DataTexture(raw, t.size, t.size, THREE.RGBAFormat);
      t.three.magFilter = THREE.NearestFilter; t.three.minFilter = THREE.NearestFilter;
      t.three.wrapS = t.three.wrapT = THREE.RepeatWrapping; t.three.colorSpace = THREE.SRGBColorSpace; t.three.needsUpdate = true;
    }
    map = t.three;
  }
  const tint = new THREE.Color(b.tint[0], b.tint[1], b.tint[2]);
  const side = b.two ? THREE.DoubleSide : THREE.FrontSide;
  // the painted lamp light (Glow.cs): texture times vertex colour, added over the surface, as the game's Particles/Unlit copy draws it
  if (b.glow) g.setAttribute('color', new THREE.Float32BufferAttribute(b.c, 3));
  const m = b.glow ? new THREE.MeshBasicMaterial({map, vertexColors: true, side, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending})
    : b.emissive ? new THREE.MeshBasicMaterial({color: tint, map}) : new THREE.MeshLambertMaterial({color: tint, map, side});
  const mesh = new THREE.Mesh(g, m); mesh.name = b.name; world.add(mesh); groups[b.name] = mesh;
}
world.add(new THREE.HemisphereLight(0xcfd6dc, 0x40382f, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(-0.4, 1, 0.3); world.add(sun);
const head = new THREE.PointLight(0xfff0d0, 3, 500, 0.6); world.add(head);
const cam = new THREE.PerspectiveCamera(70, 1280/720, 0.5, 9000);
// the bulbs' light is painted (the glow batches); opts.pool draws 0.4.1's pool of real lights instead: the 8 bulbs nearest the camera
// (height counting three times over), each fading to nothing at the distance of the nearest bulb left out
const pool = []; for (let k = 0; k < 8; k++) { const l = new THREE.PointLight(0xffcc8c, 0, 48, 1.2); world.add(l); pool.push(l); }
const lamps = []; for (let k = 0; k < scene.lamps.length; k += 3) lamps.push(new THREE.Vector3(scene.lamps[k], scene.lamps[k + 1] - 1.5, -scene.lamps[k + 2]));
window.shot = (eye, at, opts={}) => {
  for (const [n, m] of Object.entries(groups)) m.visible = !(opts.hide||[]).some(h => n.includes(h)) && !(opts.pool && n.startsWith('glow'));
  world.background = new THREE.Color(opts.bg || 0x7a7c80);
  world.fog = opts.fog ? new THREE.Fog(opts.bg || 0x7a7c80, 10, opts.fog) : null;
  sun.intensity = opts.dark ? 0.0 : 1.4; head.intensity = opts.dark ? (opts.head ?? 160) : 0; head.distance = 150; head.decay = 1.2;
  cam.fov = opts.fov || 70; cam.updateProjectionMatrix();
  cam.position.set(eye[0], eye[1], -eye[2]); head.position.copy(cam.position);
  cam.lookAt(at[0], at[1], -at[2]);
  const dist = (p, e) => Math.hypot(p.x - e.x, (p.y - e.y) * 3, p.z - e.z);
  const from = cam.position;
  const near = lamps.slice().sort((p, q) => dist(p, from) - dist(q, from));
  const edge = Math.min(400, dist(near[pool.length], from));
  pool.forEach((l, k) => {
    const x = Math.min(1, Math.max(0, (dist(near[k], from) - edge * 0.5) / (edge * 0.5)));
    const fade = 1 - x * x * (3 - 2 * x);
    l.position.copy(near[k]); l.intensity = opts.dark && opts.pool ? 260 * fade : 0;
  });
  if (opts.dark) { world.children.filter(o => o.isHemisphereLight).forEach(h => h.intensity = opts.amb ?? 0.55); } else { world.children.filter(o => o.isHemisphereLight).forEach(h => h.intensity = 1.1); }
  renderer.render(world, cam);
  return true;
};
window.ready = true;
</script></body></html>
