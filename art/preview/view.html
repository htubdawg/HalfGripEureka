<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = await (await fetch('scene.json')).json();
window.SCENE = scene;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(1280, 720); document.body.appendChild(renderer.domElement);
const world = new THREE.Scene();
const groups = {};
const backs = [];
for (const b of scene.batches) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(b.v, 3));
  // Unity is left-handed: z is mirrored, which flips the winding, so each triangle's order is swapped back
  const pos = g.attributes.position; for (let i = 0; i < pos.count; i++) pos.setZ(i, -pos.getZ(i));
  const idx = b.t.slice(); for (let i = 0; i < idx.length; i += 3) { const k = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = k; } g.setIndex(idx); g.computeVertexNormals();
  g.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
  let map = null;
  const t = scene.textures[b.tex];
  if (t) {
    if (!t.three) {
      const raw = Uint8Array.from(atob(t.px), ch => ch.charCodeAt(0));
      t.three = new THREE.DataTexture(raw, t.size, t.size, THREE.RGBAFormat);
      t.three.magFilter = THREE.NearestFilter; t.three.minFilter = THREE.NearestFilter;
      t.three.wrapS = t.three.wrapT = THREE.RepeatWrapping; t.three.colorSpace = THREE.SRGBColorSpace; t.three.needsUpdate = true;
    }
    map = t.three;
  }
  const tint = new THREE.Color(b.tint[0], b.tint[1], b.tint[2]);
  const side = b.two ? THREE.DoubleSide : THREE.FrontSide;
  // the painted lamp light (Glow.cs): texture times vertex colour, added over the surface, as the game's Particles/Unlit copy draws it
  if (b.glow) g.setAttribute('color', new THREE.Float32BufferAttribute(b.c, 3));
  const m = b.glow ? new THREE.MeshBasicMaterial({map, vertexColors: true, side, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending})
    : b.emissive ? new THREE.MeshBasicMaterial({color: tint, map}) : new THREE.MeshLambertMaterial({color: tint, map, side});
  const mesh = new THREE.Mesh(g, m); mesh.name = b.name; world.add(mesh); groups[b.name] = mesh;
  // opts.backs: one-sided surfaces seen from behind drawn magenta (the game culls them: from there the player sees through them)
  // (a surface built both ways, as QuadBoth does, has nothing to see through: those triangles are left out of the twin)
  let bg = g;
  if (!b.two && !b.glow) {
    const key = (i) => [b.v[3 * i], b.v[3 * i + 1], b.v[3 * i + 2]].map(x => x.toFixed(2)).join(',');
    const tris = [], seen = new Set();
    for (let i = 0; i < b.t.length; i += 3) { const k = [key(b.t[i]), key(b.t[i + 1]), key(b.t[i + 2])]; tris.push(k); const m = k.indexOf([...k].sort()[0]); seen.add([k[m], k[(m + 1) % 3], k[(m + 2) % 3]].join('|')); }
    const keep = [];
    for (let i = 0; i < tris.length; i++) { const k = [tris[i][0], tris[i][2], tris[i][1]]; const m = k.indexOf([...k].sort()[0]); if (!seen.has([k[m], k[(m + 1) % 3], k[(m + 2) % 3]].join('|'))) keep.push(idx[3 * i], idx[3 * i + 1], idx[3 * i + 2]); }
    if (keep.length < idx.length) { bg = g.clone(); bg.setIndex(keep); }
  }
  if (!b.two && !b.glow) { const bk = new THREE.Mesh(bg, new THREE.MeshBasicMaterial({color: 0xff00ff, side: THREE.BackSide, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4})); bk.name = b.name; bk.visible = false; world.add(bk); backs.push([b.name, bk]); }
}
world.add(new THREE.HemisphereLight(0xcfd6dc, 0x40382f, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(-0.4, 1, 0.3); world.add(sun);
const head = new THREE.PointLight(0xfff0d0, 3, 500, 0.6); world.add(head);
// opts.spot: a stand-in for a car's headlights instead of the light at the camera: a cone from just under the eye towards where it looks
const spot = new THREE.SpotLight(0xfff0d8, 0, 160, 0.5, 0.5, 1.2); world.add(spot); world.add(spot.target);
// opts.lamps = [{p, d, i, outer, inner, range, color}]: a car's headlight as the game has it (a URP spot: intensity over distance squared,
// smoothed out at its range, soft between the inner and outer cone in degrees), in game coordinates. Unity's lit shaders take no 1/pi in
// the diffuse and three's do, so the intensity is given times pi here (opts.amb likewise, to compare against the game's ambient)
const carLamps = []; for (let k = 0; k < 4; k++) { const l = new THREE.SpotLight(0xffffff, 0, 150, 0.3, 0.3, 2); world.add(l); world.add(l.target); carLamps.push(l); }
const cam = new THREE.PerspectiveCamera(70, 1280/720, 0.5, 9000);
// opts.sky: the painted dawn sky (SkyPaint.cs) on a sphere round the camera, the game's dawn weather (MapEntry.cs) for the light and fog,
// and the camera's reach the mod gives it on the surface (Backdrop.Reach, 3200)
let skyDome = null;
if (scene.sky) {
  const S = scene.sky, raw = Uint8Array.from(atob(S.px), ch => ch.charCodeAt(0));
  const tex = new THREE.DataTexture(raw, S.w, S.h, THREE.RGBAFormat); tex.colorSpace = THREE.SRGBColorSpace; tex.magFilter = tex.minFilter = THREE.LinearFilter; tex.needsUpdate = true;
  const g = new THREE.SphereGeometry(8000, 256, 128), p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = -p.getZ(i), r = Math.hypot(x, y, z);
    uv.setXY(i, (Math.atan2(z, x) + Math.PI) / (2 * Math.PI), (Math.asin(y / r) + Math.PI / 2) / Math.PI); }
  skyDome = new THREE.Mesh(g, new THREE.MeshBasicMaterial({map: tex, side: THREE.BackSide, fog: false, depthWrite: false}));
  skyDome.renderOrder = -1; skyDome.visible = false; world.add(skyDome);
}
// the bulbs' light is painted (the glow batches); opts.pool draws 0.4.1's pool of real lights instead: the 8 bulbs nearest the camera
// (height counting three times over), each fading to nothing at the distance of the nearest bulb left out
const pool = []; for (let k = 0; k < 8; k++) { const l = new THREE.PointLight(0xffcc8c, 0, 48, 1.2); world.add(l); pool.push(l); }
const lamps = []; for (let k = 0; k < scene.lamps.length; k += 3) lamps.push(new THREE.Vector3(scene.lamps[k], scene.lamps[k + 1] - 1.5, -scene.lamps[k + 2]));
// opts.car = [x, y, z, dx, dz]: a grey box the size of the player's car collider (14.2 x 2.8 x 7.3) on the floor there, facing dx, dz, for scale
const carBox = new THREE.Mesh(new THREE.BoxGeometry(7.34, 2.82, 14.2), new THREE.MeshLambertMaterial({color: 0x9a9a9a})); world.add(carBox);
window.shot = (eye, at, opts={}) => {
  carBox.visible = !!opts.car;
  sun.position.set(-0.4, 1, 0.3); sun.target.position.set(0, 0, 0); cam.far = 9000;
  if (opts.car) { const [x, y, z, dx, dz] = opts.car; carBox.position.set(x, y + 1.41, -z); carBox.rotation.set(0, Math.atan2(dx, -dz), 0); }
  for (const [n, m] of Object.entries(groups)) m.visible = !(opts.hide||[]).some(h => n.includes(h)) && !(opts.pool && n.startsWith('glow'));
  for (const [n, m] of backs) m.visible = !!opts.backs && !(opts.hide||[]).some(h => n.includes(h));
  world.background = new THREE.Color(opts.bg || 0x7a7c80);
  world.fog = opts.fog ? new THREE.Fog(opts.bg || 0x7a7c80, 10, opts.fog) : null;
  // underground, the game's haze (Glow.cs: Dark), drawn over a background of the fog's colour
  const D = scene.dark;
  if (opts.dark && D && opts.fog) { const fc = new THREE.Color().setRGB(...D.fog, THREE.SRGBColorSpace); world.background = fc; world.fog = new THREE.Fog(fc, D.fogStart, D.fogEnd); }
  sun.intensity = opts.dark ? 0.0 : 1.4; head.intensity = opts.dark ? (opts.head ?? 160) : 0; head.distance = 150; head.decay = 1.2;
  cam.fov = opts.fov || 70; cam.updateProjectionMatrix();
  cam.position.set(eye[0], eye[1], -eye[2]); head.position.copy(cam.position);
  cam.lookAt(at[0], at[1], -at[2]);
  spot.intensity = opts.dark && opts.spot ? opts.spot : 0; if (opts.spot) { head.intensity = 0; spot.position.set(eye[0], eye[1] - 5, -eye[2]); spot.target.position.set(at[0], at[1] - 7, -at[2]); }
  carLamps.forEach((l, k) => {
    const L = (opts.lamps || [])[k];
    l.intensity = L ? L.i * Math.PI : 0;
    if (!L) return;
    head.intensity = 0;
    l.color.setRGB(...(L.color || [0.7, 0.68, 0.54]), THREE.SRGBColorSpace);
    l.distance = L.range || 150; l.angle = (L.outer || 30) * Math.PI / 360; l.penumbra = 1 - (L.inner || 21.8) / (L.outer || 30);
    l.position.set(L.p[0], L.p[1], -L.p[2]); l.target.position.set(L.p[0] + L.d[0], L.p[1] + L.d[1], -(L.p[2] + L.d[2]));
  });
  const dist = (p, e) => Math.hypot(p.x - e.x, (p.y - e.y) * 3, p.z - e.z);
  const from = cam.position;
  const near = lamps.slice().sort((p, q) => dist(p, from) - dist(q, from));
  const edge = Math.min(400, dist(near[pool.length], from));
  pool.forEach((l, k) => {
    const x = Math.min(1, Math.max(0, (dist(near[k], from) - edge * 0.5) / (edge * 0.5)));
    const fade = 1 - x * x * (3 - 2 * x);
    l.position.copy(near[k]); l.intensity = opts.dark && opts.pool ? 260 * fade : 0;
  });
  // underground, the game's own fixed ambient (Glow.cs: Dark; the equator colour has no counterpart in a hemisphere light)
  for (const h of world.children.filter(o => o.isHemisphereLight)) {
    if (opts.dark) { h.color.setRGB(...D.sky, THREE.SRGBColorSpace); h.groundColor.setRGB(...D.ground, THREE.SRGBColorSpace); h.intensity = opts.amb ?? 1; }
    else { h.color.set(0xcfd6dc); h.groundColor.set(0x40382f); h.intensity = 1.1; }
  }
  if (skyDome) skyDome.visible = false;
  if (opts.sky && skyDome) {
    skyDome.visible = true; skyDome.position.copy(cam.position);
    const hz = new THREE.Color().setRGB(...scene.sky.haze, THREE.SRGBColorSpace);
    world.background = hz; world.fog = new THREE.Fog(hz, 150, opts.fog || 3000);
    cam.far = 9000; cam.updateProjectionMatrix();
    // the weather's light: from the dawn glow 12 degrees up in the east-north-east, rose; the trilight ambient as a hemisphere
    const s = scene.sky.sun, from = new THREE.Vector3(s[0], 0.2, -s[2]).normalize();
    sun.position.copy(cam.position).addScaledVector(from, 1000); if (sun.target) { sun.target.position.copy(cam.position); world.add(sun.target); }
    sun.color.setRGB(0.95, 0.68, 0.58, THREE.SRGBColorSpace); sun.intensity = 1.05 * Math.PI * 0.5;
    for (const h of world.children.filter(o => o.isHemisphereLight)) { h.color.setRGB(0.34, 0.40, 0.60, THREE.SRGBColorSpace); h.groundColor.setRGB(0.26, 0.24, 0.28, THREE.SRGBColorSpace); h.intensity = 2.2; }
  }
  renderer.render(world, cam);
  if (opts.sky) { sun.color.set(0xffffff); }
  return true;
};
// window.probe(): after a shot, the magenta (open) pixels' middle and what the rays just round it hit (batch, point): finds a hole's edges
window.probe = () => {
  const c2 = document.createElement('canvas'); c2.width = 1280; c2.height = 720; const ctx = c2.getContext('2d');
  ctx.drawImage(renderer.domElement, 0, 0); const px = ctx.getImageData(0, 0, 1280, 720).data;
  let sx = 0, sy = 0, n = 0;
  for (let y = 0; y < 720; y += 2) for (let x = 0; x < 1280; x += 2) { const k = (y * 1280 + x) * 4; if (px[k] > 200 && px[k + 1] < 60 && px[k + 2] > 200) { sx += x; sy += y; n++; } }
  if (!n) return null;
  const cx = sx / n, cy = sy / n, rc = new THREE.Raycaster(), hits = [];
  const vis = Object.values(groups).filter(m => m.visible);
  for (let a = 0; a < 16; a++) for (const r of [6, 14, 30]) {
    const x = cx + Math.cos(a * Math.PI / 8) * r, y = cy + Math.sin(a * Math.PI / 8) * r;
    rc.setFromCamera(new THREE.Vector2(x / 640 - 1, 1 - y / 360), cam);
    const h = rc.intersectObjects(vis, false)[0];
    hits.push(h ? { name: h.object.name, p: [h.point.x, h.point.y, -h.point.z].map(v => Math.round(v * 10) / 10), d: Math.round(h.distance) } : { name: 'none' });
  }
  rc.setFromCamera(new THREE.Vector2(cx / 640 - 1, 1 - cy / 360), cam);
  return { n, cx, cy, dir: [rc.ray.direction.x, rc.ray.direction.y, -rc.ray.direction.z], hits };
};
// window.pick(x, y): what the ray through a pixel hits first, front faces and (opts.backs) back faces alike: names a magenta surface
window.pick = (x, y) => {
  const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(x / 640 - 1, 1 - y / 360), cam);
  const objs = Object.values(groups).filter(m => m.visible).concat(backs.map(b => b[1]).filter(m => m.visible));
  return rc.intersectObjects(objs, false).slice(0, 3).map(h => ({ name: h.object.name, back: h.object.material.side === THREE.BackSide, p: [h.point.x, h.point.y, -h.point.z].map(v => Math.round(v * 10) / 10), d: Math.round(h.distance) }));
};
window.ready = true;
</script></body></html>
